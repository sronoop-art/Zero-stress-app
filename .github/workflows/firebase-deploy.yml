name: Deploy Firebase Backend

# Deploys Firestore RULES + COMPOSITE INDEXES whenever they change on ZS3.1
# (or manually from the Actions tab). Both are FREE on the Spark plan - no
# card and no billing required.
#
#   https://firebase.google.com/docs/firestore/pricing lists only TTL deletes,
#   PITR, backups, restore and clone as requiring billing. Creating and
#   deploying composite indexes is NOT chargeable, so the match_logs
#   (playerId, date) index the player-dashboard PERFORMANCE chart depends on
#   can be shipped on the free plan.
#
# Cloud Functions are the only part that needs Blaze, so they are deployed
# last and are allowed to fail - push delivery runs through the free-cron
# workflow instead, so nothing is lost by skipping them.
#
# Requires ONE repository secret:
#
#   FIREBASE_SERVICE_ACCOUNT - a service-account JSON key with the
#   "Firebase Admin" role for project zerostress-3a536.
#
# How to create it (one time, ~3 minutes):
#   1. https://console.firebase.google.com -> your project
#   2. Project settings (gear) -> Service accounts
#   3. "Generate new private key" -> downloads a JSON file
#   4. GitHub repo -> Settings -> Secrets and variables -> Actions
#      -> New repository secret -> Name: FIREBASE_SERVICE_ACCOUNT
#      -> paste the WHOLE JSON file content as the value
#   5. (Optional, NOT needed for rules/indexes) Only if you later upgrade to
#      Blaze for Cloud Functions:
#      https://console.firebase.google.com/project/zerostress-3a536/usage/details
#      Creating the service account key above is free and works on Spark.
#   6. Grant the account deploy permissions (skip only if it already has
#      the Editor role):
#      https://console.cloud.google.com/iam-admin/iam?project=zerostress-3a536
#      -> find firebase-adminsdk-...@zerostress-3a536.iam.gserviceaccount.com
#      -> pencil (Edit) -> add BOTH roles:
#           - Firebase Develop Admin        (functions + rules deploys)
#           - Service Account User          (functions runtime actAs)
#      Without these the deploy fails with:
#      "firebaserules ... 403 The caller does not have permission"

on:
  push:
    branches: [ZS3.1, main]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate service account secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is NOT set (or is empty)."
            echo "::error::Fix: GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "::error::The name must be exactly: FIREBASE_SERVICE_ACCOUNT (repository secret, not environment secret)."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
          node -e "
            const fs = require('fs');
            try {
              const j = JSON.parse(fs.readFileSync('/tmp/sa.json', 'utf8'));
              if (!j.client_email || !j.private_key) throw new Error('missing client_email/private_key fields');
              console.log('Service account OK:', j.client_email);
            } catch (e) {
              console.log('::error::FIREBASE_SERVICE_ACCOUNT is not valid service-account JSON (' + e.message + ').');
              console.log('::error::Re-create it: Firebase Console -> Project settings -> Service accounts -> Generate new private key, then paste the ENTIRE JSON file content.');
              process.exit(1);
            }
          "

      # Rules + composite indexes deploy FIRST and must succeed - both are free
      # on Spark. This ships App Check enforcement, the hardened match_logs /
      # chat rules, and the match_logs(playerId, date) index that the player
      # dashboard PERFORMANCE chart needs before its query can return anything.
      - name: Deploy Firestore rules + indexes (free - no Blaze)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          npx --yes firebase-tools@13 deploy \
            --only firestore:rules,firestore:indexes \
            --project zerostress-3a536 \
            --force || {
              echo "::error::Firestore deploy failed with a permission error?"
              echo "::error::Grant roles/firebase.developAdmin to the firebase-adminsdk service account via Cloud Shell (see workflow header), then re-run."
              exit 1
            }

      # Everything below is Blaze-only and must never block the free deploy
      # above, so each step is allowed to fail on its own.
      - name: Install functions dependencies
        continue-on-error: true
        run: npm --prefix functions install --no-audit --no-fund

      - name: Syntax-check functions
        continue-on-error: true
        run: node --check functions/index.js

      # Cloud Functions require the Blaze plan, which this project deliberately
      # does not use (pushes are delivered by the free-cron workflow instead).
      # Kept here for a future Blaze upgrade; cannot fail the run.
      - name: Deploy Cloud Functions (Blaze only - skipped on Spark)
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: |
          npx --yes firebase-tools@13 deploy \
            --only functions \
            --project zerostress-3a536 \
            --force || {
              echo "::warning::Functions deploy skipped - Cloud Functions require the Blaze plan. Pushes are delivered by the free-cron workflow, so nothing is lost."
              exit 1
            }

      - name: Cleanup
        if: always()
        run: rm -f /tmp/sa.json
