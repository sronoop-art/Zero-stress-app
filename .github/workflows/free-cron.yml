name: Free-plan cron (push relay + resets + reminders)

# Runs WITHOUT the paid Blaze plan. Requires GitHub secrets:
#   FIREBASE_SERVICE_ACCOUNT - already configured (drives Firestore AND push
#                              delivery via FCM HTTP v1 - no server key needed)
#
# Schedule: every 5 minutes (UTC; GitHub may still drift or skip a tick).
# The repo is public, so Actions minutes are free - a 5-minute tick costs
# ~20s of runner time and is the difference between "instant" and "an hour
# late" for chat/mention pushes. Match reminders use a 15-minute pre-start
# window, so the worst-case delay is ~20 minutes before kickoff.
#
# THIS INTERVAL IS THE FALLBACK PUSH LATENCY. This relay is the only sender on
# the free Spark plan (the Cloud Functions deploy is skipped without Blaze), so
# chat, mention and admin-broadcast notifications reach devices within one tick
# - i.e. up to ~5 minutes late. Two ways to make pushes fully instant:
#   1. Run the always-on Knock bridge in server/ (Firestore listener -> Knock
#      workflow "zs-push", seconds; see server/README.md). Both senders share
#      the pushSent flag, so this relay never double-sends what the bridge sent.
#   2. Upgrade the project to Blaze so functions/index.js runs on every write
#      (Firestore trigger, seconds).
# Note: GitHub's scheduler can delay or skip a tick under load, so treat the
# interval as a floor, not a guarantee.
# Admin broadcasts (uid: null) are pushed by this relay too - see sendToAll in
# functions/cron.js - so this interval also gates announcements.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - reminders
          - season
          - reset

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        run: npm --prefix functions install --no-audit --no-fund

      - name: Validate secrets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is not set."
            exit 1
          fi
          node -e "JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT)" || {
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON."
            exit 1
          }

      - name: Ensure player docs exist (enables push tokens)
        # Idempotent: creates ONLY the players/{uid} docs that are missing, so
        # accounts that registered before the app wrote one can store their FCM
        # token again. Without a doc the token save is rejected and the relay
        # below has nothing to send to. Never edits an existing doc.
        # Non-fatal: if the service account cannot list Auth users the relay
        # still runs.
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          NODE_PATH: functions/node_modules
        run: node scripts/backfill-players.cjs

      - name: Run cron jobs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CRON_JOB: ${{ inputs.job || 'all' }}
        run: node functions/cron.js
