name: Free-plan cron (push relay + resets + reminders)

# Runs WITHOUT the paid Blaze plan. Requires GitHub secrets:
#   FIREBASE_SERVICE_ACCOUNT - already configured (drives Firestore AND push
#                              delivery via FCM HTTP v1 - no server key needed)
#
# Schedule: every 30 minutes (UTC; GitHub may drift a few minutes).
# Match reminders use a 15-minute pre-start window, so the worst-case
# delay is ~45 minutes before kickoff.
#
# THIS INTERVAL IS THE PUSH LATENCY. This relay is the only sender on the free
# Spark plan (the Cloud Functions deploy is skipped without Blaze), so chat,
# mention and admin-broadcast notifications reach devices within one tick -
# i.e. up to ~30 minutes late. Two ways to make pushes instant:
#   1. Upgrade the project to Blaze so functions/index.js runs on every write
#      (Firestore trigger, seconds), or
#   2. shorten the cron below (GitHub's minimum is "*/5 * * * *"; scheduled
#      minutes are metered on private repos and GitHub may delay runs under load).
# Admin broadcasts (uid: null) are pushed by this relay too - see sendToAll in
# functions/cron.js - so this interval also gates announcements.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - reminders
          - season
          - reset

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        run: npm --prefix functions install --no-audit --no-fund

      - name: Validate secrets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is not set."
            exit 1
          fi
          node -e "JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT)" || {
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON."
            exit 1
          }

      - name: Run cron jobs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CRON_JOB: ${{ inputs.job || 'all' }}
        run: node functions/cron.js
