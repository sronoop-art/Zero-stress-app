# JVM memory — tuned for building on-device with AndroidIDE (phone RAM).
# Increase -Xmx if your device has plenty of free RAM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# AndroidX is required for Jetpack Compose
android.useAndroidX=true
# Kotlin code style
kotlin.code.style=official
# Faster incremental builds / smaller R classes
android.nonTransitiveRClass=true
# Do not block AndroidIDE builds with configuration cache issues
org.gradle.configuration-cache=false

# Agora App ID — a public identifier (it ships inside every APK anyway), safe to commit.
# The App CERTIFICATE is intentionally NOT committed. If you enable the App
# Certificate (token mode) in the Agora Console, add this locally:
#   AGORA_APP_CERTIFICATE=your-certificate-here
AGORA_APP_ID=f8159b2c6adc4a468f269897bec01748