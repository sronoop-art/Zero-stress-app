# JVM memory — tuned for building on-device with AndroidIDE (phone RAM).
# Increase -Xmx if your device has plenty of free RAM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# AndroidX is required for Jetpack Compose
android.useAndroidX=true
# Kotlin code style
kotlin.code.style=official
# Faster incremental builds / smaller R classes
android.nonTransitiveRClass=true
# Do not block AndroidIDE builds with configuration cache issues
org.gradle.configuration-cache=false